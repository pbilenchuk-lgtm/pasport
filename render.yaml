# Деплой на Render. Тип сервиса — Background Worker: входящий HTTP не нужен.
#
# Собирается Docker-образ с Chromium (Вариант Б). Так сделано не для красоты:
# прямые запросы с датацентровых IP сайт отдаёт как 403, а доступные прокси
# отвечают челленджем Cloudflare, который проходит только настоящий браузер.
# Подробности и измерения — в README, раздел «Если Cloudflare блокирует».

services:
  - type: worker
    name: passport-queue-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt          # ближайший к Варшаве регион Render

    envVars:
      # --- секреты: значения задаются в дашборде Render, не в этом файле ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # Обход блокировки по IP. С IP Render сайт отдаёт 403, поэтому без прокси
      # монитор работать не будет — см. README, «Если Cloudflare блокирует».
      #
      # PROXY_LIST — список адресов через перевод строки, монитор сам выберет
      # рабочий и переключится, если тот отвалится. Формат строки:
      # host:port:user:pass  или  http://user:pass@host:port
      - key: PROXY_LIST
        sync: false
      # Альтернатива: один адрес (или Secret File через PROXY_LIST_PATH).
      - key: SCRAPE_PROXY
        sync: false

      # --- обычные настройки ---
      - key: FETCH_MODE
        value: browser         # direct | browser | auto
      # В режиме браузера интервал берётся из BROWSER_*: 60 + 0..30 = 60–90 сек.
      - key: BROWSER_INTERVAL_SECONDS
        value: "60"
      - key: BROWSER_JITTER_SECONDS
        value: "30"
      # Сколько ждать прохождения челленджа Cloudflare. Настоящий браузер
      # обычно проходит его за 5–10 секунд, запас взят с большим избытком.
      - key: CHALLENGE_WAIT_SECONDS
        value: "60"
      - key: ERROR_THRESHOLD
        value: "5"
      - key: ERROR_PAUSE_MINUTES
        value: "15"
      - key: HEARTBEAT_HOUR
        value: "10"
      - key: HEARTBEAT_TIMEZONE
        value: Europe/Warsaw
      - key: STATE_PATH
        value: /var/data/state.json
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

    # Диск, чтобы state.json переживал передеплой. Без него после рестарта
    # придёт максимум одно повторное уведомление — не критично, можно убрать.
    disk:
      name: monitor-state
      mountPath: /var/data
      sizeGB: 1
